name: API CI

on:
  push:
    branches:
      - main
      - master
      - developer
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    env:
      # Valores sintéticos para inicialização dos módulos durante os testes.
      # Nenhum teste do CI deve acessar banco ou segredo de produção.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nossosaldo_test
      JWT_EXPIRES: 3600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test keys
        run: |
          openssl genrsa -out keys/private.key 2048
          openssl rsa -in keys/private.key -pubout -out keys/public.key

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
